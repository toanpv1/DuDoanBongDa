<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng xếp hạng - Predictor</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="app-wrapper" id="app"></div>
    <script src="/js/app.js"></script>
    <script>
        if (!requireAuth()) throw 'redirect';
        const app = document.getElementById('app');
        app.innerHTML = buildSidebar('leaderboard') + `
        <main class="main-content">
            <div class="page-header"><div><h1 class="page-title">🏆 Bảng xếp hạng</h1><p class="page-subtitle">Xem vị trí của bạn trong cuộc đua dự đoán</p></div></div>
            <div class="card">
                <div id="leaderboardTable"><div class="loading-overlay"><div class="spinner"></div> Đang tải...</div></div>
            </div>
        </main>`;

        loadLeaderboard();

        async function loadLeaderboard() {
            try {
                const tid = getActiveTournamentId();
                const data = await Api.get(`/api/leaderboard/${tid}`);
                const userId = Api.getUser().userId;
                const container = document.getElementById('leaderboardTable');

                if (!data || data.length === 0) {
                    container.innerHTML = '<div class="empty-state"><div class="empty-icon">🏆</div><p class="empty-text">Chưa có dữ liệu xếp hạng</p></div>';
                    return;
                }

                container.innerHTML = `<div class="table-wrapper"><table>
                    <thead><tr>
                        <th style="width:60px">#</th><th>Thành viên</th><th style="text-align:center">Điểm</th>
                        <th style="text-align:center">Đúng</th><th style="text-align:center">Sai</th>
                        <th style="text-align:center">Bỏ lỡ</th><th style="text-align:center">Tỷ lệ</th>
                        <th style="width:120px">Tiến trình</th>
                    </tr></thead>
                    <tbody>${data.map(e => `
                        <tr class="${e.userId == userId ? 'highlight' : ''}" style="${e.userId == userId ? 'font-weight:700' : ''}">
                            <td><span class="rank-badge ${e.rank <= 3 ? 'rank-' + e.rank : ''}" style="${e.rank > 3 ? 'background:var(--bg-secondary);color:var(--text-muted)' : ''}">${e.rank}</span></td>
                            <td>${e.displayName} ${e.userId == userId ? '<span style="color:var(--accent)">⭐ (Bạn)</span>' : ''}</td>
                            <td style="text-align:center"><span class="points-badge">${e.totalPoints}</span></td>
                            <td style="text-align:center;color:var(--success)">${e.correctPredictions}</td>
                            <td style="text-align:center;color:var(--danger)">${e.wrongPredictions}</td>
                            <td style="text-align:center;color:var(--text-muted)">${e.missedPredictions}</td>
                            <td style="text-align:center;font-weight:600">${e.accuracy}%</td>
                            <td><div class="accuracy-bar"><div class="accuracy-fill" style="width:${e.accuracy}%"></div></div></td>
                        </tr>
                    `).join('')}</tbody>
                </table></div>`;
            } catch (err) { showToast('Lỗi tải bảng xếp hạng', 'error'); }
        }
    </script>
</body>
</html>
